<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Markdown Editor</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
<style>
  body {display: flex; height: 100vh; margin: 0; font-family: sans-serif;}
  textarea {width: 50%; padding: 10px; font-family: monospace; font-size: 14px;}
  #preview {width: 50%; padding: 10px; overflow-y: auto; border-left: 1px solid #ccc;}
  #toolbar {position: fixed; top: 10px; right: 20px; background: #fff; padding: 5px; border: 1px solid #ccc;}
  #toc {margin-bottom: 20px; font-size: 14px;}
</style>
</head>
<body>

<div id="toolbar">
  <button onclick="downloadMD()">Export .md</button>
  <button onclick="exportPDF()">Export PDF</button>
</div>

<textarea id="editor" oninput="updatePreview()">
# Welcome
Start typing your Markdown here...
</textarea>

<div id="preview"></div>

<script>
function updatePreview() {
    const markdownText = document.getElementById("editor").value;
    document.getElementById("preview").innerHTML = generateTOC(markdownText) + marked.parse(markdownText);
}

function generateTOC(md) {
    const lines = md.split("\n");
    let toc = "<div id='toc'><strong>Table of Contents</strong><ul>";
    lines.forEach(line => {
        const match = line.match(/^(#{1,6})\s+(.*)/);
        if (match) {
            const level = match[1].length;
            const text = match[2];
            const anchor = text.toLowerCase().replace(/[^
\w]+/g, "-");
            toc += `<li style="margin-left:${(level-1)*10}px"><a href="#${anchor}">${text}</a></li>`;
        }
    });
    toc += "</ul></div>";
    return toc;
}

function downloadMD() {
    const text = document.getElementById("editor").value;
    const blob = new Blob([text], { type: "text/markdown" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "document.md";
    a.click();
    URL.revokeObjectURL(url);
}

// This is the correct name for the export function
function exportPDF() {
    // Ensure preview is up-to-date before exporting
    updatePreview();
    const element = document.getElementById('preview');
    const opt = {
        margin:       0.5,
        filename:     'document.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
    };
    html2pdf().set(opt).from(element).save();
}

updatePreview();
</script>
</body>
</html>
