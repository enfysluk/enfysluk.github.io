<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Markdown Editor</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  /* ===== Base layout (white theme) ===== */
  html, body { height: 100%; margin: 0; background:#fff; color:#000; font-family: -apple-system, system-ui, Segoe UI, Roboto, "PingFang SC","Microsoft YaHei", Arial, sans-serif; }
  body { display: flex; }
  textarea { width: 50%; padding: 12px; border: 0; border-right: 1px solid #e5e5e5; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; outline: none; }
  #preview { width: 50%; padding: 16px 18px; overflow-y: auto; }
  #toolbar { position: fixed; top: 10px; right: 16px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 6px; display: flex; gap: 6px; z-index: 999; }
  #toolbar button, #toolbar label { font-size: 12px; padding: 6px 10px; background:#fff; border:1px solid #ddd; border-radius:6px; cursor:pointer; }
  #toolbar input[type="file"]{ display:none; }

  /* ===== Content look ===== */
  #preview h1{ font-size: 28px; margin: 8px 0 10px; }
  #preview h2{ font-size: 20px; margin: 16px 0 8px; }
  #preview h3{ font-size: 16px; margin: 14px 0 6px; }
  #preview p{ margin: 6px 0; }
  /* bullet 缩进减小一档 */
  #preview ul, #preview ol { padding-left: 16px; margin: 6px 0; }
  #preview li { margin: 2px 0; }
  #preview hr{ border: 0; border-top: 1px solid #eee; margin: 12px 0; }
  #toc { margin: 0 0 10px; font-size: 14px; }
  #toc ul { list-style: none; padding-left: 0; margin: 6px 0 0; }
  #toc li { margin: 2px 0; }
  #toc a { text-decoration: none; color: #3b82f6; }
  /* 打印/PDF 时隐藏目录 */
  @media print { .toc, #toc { display: none !important; } }
</style>
</head>
<body>

<div id="toolbar">
  <label>
    Import .md
    <input id="importer" type="file" accept=".md,.markdown,text/markdown" />
  </label>
  <button onclick="downloadMD()">Export .md</button>
  <button onclick="exportPDF()">Export PDF</button>
</div>

<textarea id="editor" oninput="updatePreview()">
# Welcome
Start typing your Markdown here...
</textarea>

<div id="preview"></div>

<script>
  // ----- marked config -----
  marked.setOptions({ mangle:false, headerIds:true });

  // ----- render preview + TOC (screen only) -----
  function updatePreview(){
    const src = document.getElementById('editor').value;
    const html = marked.parse(src);

    // wrap once to get headings with stable ids
    const wrap = document.createElement('div');
    wrap.innerHTML = html;

    const hs = [...wrap.querySelectorAll('h1,h2,h3,h4,h5,h6')];
    let toc = `<div id="toc" class="toc"><strong>Table of Contents</strong><ul>`;
    hs.forEach(h => {
      if(!h.id){
        h.id = h.textContent.trim().toLowerCase().replace(/[^\w\- ]+/g,'').replace(/\s+/g,'-');
      }
      const level = Number(h.tagName.slice(1));
      toc += `<li style="margin-left:${(level-1)*10}px"><a href="#${h.id}">${h.textContent}</a></li>`;
    });
    toc += `</ul></div>`;

    document.getElementById('preview').innerHTML = toc + wrap.innerHTML;
  }
  updatePreview();

  // ----- Import .md -----
  document.getElementById('importer').addEventListener('change', (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = evt => {
      document.getElementById('editor').value = evt.target.result || '';
      updatePreview();
      e.target.value = ''; // reset for next import
    };
    reader.readAsText(file, 'utf-8');
  });

  // ----- Export .md -----
  function downloadMD(){
    const text = document.getElementById('editor').value;
    const blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'document.md';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ----- Export PDF (iOS-safe print-to-PDF, A4, hide TOC) -----
  function exportPDF(){
    updatePreview(); // ensure latest
    const srcHTML = document.getElementById('preview').innerHTML;

    const iframe = document.createElement('iframe');
    Object.assign(iframe.style,{position:'fixed',right:'0',bottom:'0',width:'0',height:'0',border:'0'});
    document.body.appendChild(iframe);

    const doc = iframe.contentDocument || iframe.contentWindow.document;
    doc.open();
    doc.write(`<!doctype html>
<html><head>
<meta charset="utf-8"><title>Export PDF</title>
<style>
  @page { size: A4; margin: 14mm; }
  html, body { background:#fff;
